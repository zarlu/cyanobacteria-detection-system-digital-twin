[project]
name = "cyanobacteria-detection-system-digital-twin"
version = "0.1.0"
description = "Cyanobacteria Detection System Digital Twin: ingest API, simulator and dashboard for a Rio Grande cyanobacteria-risk digital twin (TAMIU senior design)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "sqlalchemy==2.1.7",
  "pandas==3.1.0",
  "numpy==2.5.4",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "streamlit==1.66.1",
  "plotly==7.1.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "shap==0.54.1",
  "joblib==1.6.0",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "contract", "db", "sim", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sim_out", "/data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not e2e'"
markers = ["e2e: end-to-end tests that start real processes (run with make test-e2e)"]
filterwarnings = [
  "error::DeprecationWarning:api",
  "error::DeprecationWarning:contract",
  "error::DeprecationWarning:db",
  "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
