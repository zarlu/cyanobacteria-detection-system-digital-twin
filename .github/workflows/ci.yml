name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: make setup
      - run: make lint
      - run: make test
